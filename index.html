<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Library</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        /* Form Styling */
        .form-container {
            max-width: 500px;
            margin: 0 auto 2.5rem auto;
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="file"],
        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            background: white;
        }

        button.add-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: #2bc48a;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.add-btn:hover {
            background-color: #25a272;
        }

        /* Library Grid Styling */
        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .book-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            transition: transform 0.2s;
        }

        .book-card:hover {
            transform: translateY(-4px);
        }

        .book-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            background-color: #e2e8f0;
        }

        .book-info {
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: #1a202c;
        }

        .book-author {
            font-size: 0.9rem;
            color: #4a5568;
            margin-bottom: 0.5rem;
            font-style: italic;
        }

        .book-genre {
            display: inline-block;
            align-self: center;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: #e2e8f0;
            color: #2d3748;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .delete-btn {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .delete-btn:hover {
            background-color: #c53030;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Personal Library</h1>
        <p>Keep track of the books you own</p>
    </header>

    <!-- Input Form -->
    <div class="form-container">
        <form id="bookForm">
            <div class="form-group">
                <label for="title">Book Title</label>
                <input type="text" id="title" placeholder="e.g. The Hobbit" required>
            </div>
            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" placeholder="e.g. J.R.R. Tolkien" required>
            </div>
            <div class="form-group">
                <label for="genre">Genre</label>
                <select id="genre" required>
                    <option value="" disabled selected>Select a genre</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Non-Fiction">Non-Fiction</option>
                    <option value="Mystery">Mystery</option>
                    <option value="Biography">Biography</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="imageFile">Book Cover Image</label>
                <input type="file" id="imageFile" accept="image/*" required>
            </div>
            <button type="submit" class="add-btn">Add Book</button>
        </form>
    </div>

    <!-- Books Display Area -->
    <div class="library-grid" id="libraryGrid"></div>

    <script>
        const bookForm = document.getElementById('bookForm');
        const libraryGrid = document.getElementById('libraryGrid');

        bookForm.addEventListener('submit', function(event) {
            event.preventDefault();

            // Get text input values
            const titleInput = document.getElementById('title').value;
            const authorInput = document.getElementById('author').value;
            const genreInput = document.getElementById('genre').value;
            const imageFileInput = document.getElementById('imageFile');

            const file = imageFileInput.files[0];

            if (file) {
                // Read local image file using FileReader
                const reader = new FileReader();

                reader.onload = function(e) {
                    const imageDataUrl = e.target.result;

                    // Create book card element
                    const bookCard = document.createElement('div');
                    bookCard.classList.add('book-card');

                    // Render details inside card
                    bookCard.innerHTML = `
                        <img src="${imageDataUrl}" alt="${titleInput}">
                        <div class="book-info">
                            <div>
                                <div class="book-title">${titleInput}</div>
                                <div class="book-author">by ${authorInput}</div>
                                <span class="book-genre">${genreInput}</span>
                            </div>
                            <button class="delete-btn">Remove</button>
                        </div>
                    `;

                    // Handle card removal
                    const deleteBtn = bookCard.querySelector('.delete-btn');
                    deleteBtn.addEventListener('click', function() {
                        bookCard.remove();
                    });

                    libraryGrid.appendChild(bookCard);
                    bookForm.reset();
                };

                reader.readAsDataURL(file); // Convert local file to displayable string
            }
        });
    </script>
</body>
</html>
